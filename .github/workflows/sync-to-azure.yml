name: Sync GitHub to Azure DevOps

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
      - hotfix/**

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Azure DevOps
        env:
          AZURE_PAT: ${{ secrets.AZURE_PAT }}
          AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}
        run: |
          echo "Starting sync..."

          git remote remove azure || true

          CLEAN_URL=$(echo "$AZURE_REPO_URL" | tr -d '\r\n')

          git remote add azure "https://:$AZURE_PAT@${CLEAN_URL#https://}"

          echo "Pushing branch: ${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            git push azure HEAD:master --force
          else
            git push azure HEAD:${GITHUB_REF_NAME} --force
          fi
