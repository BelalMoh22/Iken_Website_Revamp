name: Sync GitHub main to Azure master

on:
  push:
    branches:
      - main

jobs:
  sync-to-azure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to Azure master
        env:
          AZURE_PAT: ${{ secrets.AZURE_PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git remote add azure https://anything:${AZURE_PAT}@dev.azure.com/ORG_NAME/PROJECT_NAME/_git/REPO_NAME

          git push azure main:master
