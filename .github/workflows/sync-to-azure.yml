name: Sync GitHub to Azure DevOps

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - hotfix/**

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Azure DevOps
        run: |
          git remote add azure https://$AZURE_PAT@${AZURE_REPO_URL#https://}
          
          # Push main -> master
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            git push azure HEAD:master --force
          else
            git push azure HEAD:${GITHUB_REF_NAME} --force
          fi
        env:
          AZURE_PAT: ${{ secrets.AZURE_PAT }}
          AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}
